name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  security-events: write

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            refactor
            ci
            docs
            test
            style
            perf
            build
            revert
          scopes: |
            deps
            ci
            main
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$

  quality:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        if: ${{ !cancelled() }}
        run: npm run format:check

      - id: eslint
        name: ESLint (SARIF)
        if: ${{ !cancelled() }}
        run: npm run lint:ci

      - name: Upload ESLint SARIF
        if: ${{ !cancelled() && steps.eslint.outcome != 'skipped' }}
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: eslint.sarif

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Tests
        if: ${{ !cancelled() }}
        run: npm run test

  e2e:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

  gate:
    name: Gate
    needs: [pr-title, quality, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        env:
          PR_TITLE: ${{ needs.pr-title.result }}
          QUALITY: ${{ needs.quality.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          fail=0
          for name in PR_TITLE QUALITY E2E; do
            result="${!name}"
            echo "${name}=${result}"
            case "${result}" in
              success|skipped) ;;
              *) echo "::error::${name} did not pass (${result})"; fail=1 ;;
            esac
          done
          exit "${fail}"

name: Release

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: release-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  open-pr:
    name: Open release PR
    if: |
      github.event_name == 'push' &&
      !startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Open release PR
        uses: stargrid-systems/calver-release@33c10243a23261f1dd29483d9ac2bf2b0da97bf3 # v2.0.1
        with:
          version-file: package.json

  tag:
    name: Tag release
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-slim
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - id: tag
        name: Create release
        uses: stargrid-systems/calver-release@33c10243a23261f1dd29483d9ac2bf2b0da97bf3 # v2.0.1
        with:
          version-file: package.json
          mode: tag

  build:
    name: Build
    needs: tag
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (static)
        run: npm run generate

      - name: Stash static output
        run: mv .output/public static-output

      - name: Build (deno SSR)
        run: npm run build:deno

      - name: Install squashfs-tools
        run: sudo apt-get install -y squashfs-tools

      - name: Archive build outputs
        run: |
          repro_time=$(git log -1 --format=%ct)
          squashfs_args=(-comp zstd -noappend \
            -mkfs-time "${repro_time}" -all-time "${repro_time}" -root-time "${repro_time}" \
            -force-uid 0 -force-gid 0 -info)

          mksquashfs "$(realpath static-output)" spectra-static.squashfs "${squashfs_args[@]}"
          mksquashfs "$(realpath .output)" spectra-deno.squashfs "${squashfs_args[@]}"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spectra-squashfs
          path: |
            spectra-static.squashfs
            spectra-deno.squashfs
          retention-days: 1

  publish:
    name: Publish
    needs: [tag, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spectra-squashfs

      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Login to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=${{ needs.tag.outputs.version }}

      - name: Push to registry
        run: |
          LABEL_ARGS=()
          while IFS= read -r label; do
            [ -z "$label" ] && continue
            LABEL_ARGS+=("--annotation" "$label")
          done <<<'${{ steps.meta.outputs.labels }}'

          while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue
            echo "Pushing ${TAG}"

            oras push "$TAG" \
              "${LABEL_ARGS[@]}" \
              --artifact-type application/vnd.spectra \
              ./spectra-static.squashfs:application/vnd.spectra.squashfs \
              ./spectra-deno.squashfs:application/vnd.spectra.deno.squashfs
          done <<<'${{ steps.meta.outputs.tags }}'
